name: CogniMorph Production Recovery Smoke
on:
  pull_request:
    branches:
      - governance/protected-runtime-release-policy-20261011
permissions: {contents: read}
jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify live site serves purchase recovery
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 3 --retry-delay 3 --max-time 60 -fsSL https://syntropix.in/assessment-runtime-v3.js -o /tmp/runtime.js
          curl --retry 3 --retry-delay 3 --max-time 60 -fsSL https://syntropix.in/auth-passwordless.js -o /tmp/auth.js
          grep -Fq 'Already paid? Restore your assessment access' /tmp/runtime.js
          grep -Fq '/payments/recover-purchase' /tmp/runtime.js
          grep -Fq 'verifyOtp' /tmp/auth.js
          echo 'Published website recovery script verified'
      - name: Anonymous backend entitlement recovery denied
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl --retry 3 --retry-delay 3 --max-time 60 -sS -o /tmp/out.json -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d '{"assessmentName":"CogniMorph Index"}' \
            https://syntropix-backend.onrender.com/api/payments/recover-purchase)
          test "$code" = '401'
          node -e "let d=JSON.parse(require('fs').readFileSync('/tmp/out.json')); if(d.status!=='error')process.exit(1)"
          echo 'Anonymous recover-purchase rejected correctly'
      - name: Invalid purchase sign-in request does not reveal account status
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl --retry 2 --retry-delay 3 --max-time 60 -sS -o /tmp/no-purchase.json -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d '{"email":"synthetic.no.purchase.invalid@example.invalid","assessmentName":"CogniMorph Index"}' \
            https://syntropix-backend.onrender.com/api/payments/request-purchase-signin)
          test "$code" = '200'
          node -e "const d=JSON.parse(require('fs').readFileSync('/tmp/no-purchase.json')); if(d.status!=='success'||!d.message.includes('If an approved purchase'))process.exit(1)"
          echo 'Invalid purchase lookup returns uniform response'
