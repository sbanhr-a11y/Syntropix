name: Deploy Syntropix website to GitHub Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "syntropix-custom-pages"
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Compile canonical assessment data and website artifact
        shell: bash
        run: |
          set -euo pipefail
          # The historical monolith is used only as a frozen migration source in CI.
          # It is never copied to the deploy artifact and no production route executes it.
          test -s index.html
          test "$(wc -c < index.html)" -gt 500000
          python tools/build-assessment-registry-v3.py --source index.html --output assessment-registry-v3.js
          test -s assessment-registry-v3.js
          test "$(wc -c < assessment-registry-v3.js)" -gt 10000
          cp homepage-v4.html index.html
          python - <<'PY'
          from pathlib import Path
          premium_css='<link rel="stylesheet" href="/premium-ui-v1.css" data-syntropix-theme="premium-champagne">'
          consumer_css='<link rel="stylesheet" href="/consumer-insight-cards.css">'
          mobile_css='<link rel="stylesheet" href="/mobile-responsive-v1.css">'
          premium_js='<script src="/premium-ui-v1.js" defer></script>'
          footer_js='<script src="/global-footer-v1.js" defer></script>'
          meta_js='<script src="/assessment-card-meta-v9.js" defer></script>'
          for p in Path('.').rglob('*.html'):
              text=p.read_text(encoding='utf-8')
              if '</head>' in text and premium_css not in text:text=text.replace('</head>',premium_css+'\n</head>',1)
              if '</head>' in text and consumer_css not in text:text=text.replace('</head>',consumer_css+'\n</head>',1)
              if '</head>' in text and mobile_css not in text:text=text.replace('</head>',mobile_css+'\n</head>',1)
              if '</body>' in text and premium_js not in text:text=text.replace('</body>',premium_js+'\n</body>',1)
              if '</body>' in text and footer_js not in text:text=text.replace('</body>',footer_js+'\n</body>',1)
              if '</body>' in text and meta_js not in text:text=text.replace('</body>',meta_js+'\n</body>',1)
              p.write_text(text,encoding='utf-8')
          p=Path('index.html');t=p.read_text(encoding='utf-8');tag='<script src="/assessment-invite-router-v1.js" defer></script>'
          if tag not in t:t=t.replace('</body>',tag+'\n</body>',1)
          p.write_text(t,encoding='utf-8')
          p=Path('professionals.html');t=p.read_text(encoding='utf-8')
          for src in ['/assessment-suite-v2-catalogue.js','/consumer-insight-catalogue.js','/assessment-assignment-ui-v1.js']:
              tag=f'<script src="{src}" defer></script>'
              if tag not in t:t=t.replace('</body>',tag+'\n</body>',1)
          p.write_text(t,encoding='utf-8')
          PY
          # Production artifact must not contain the old executable assessment front.
          rm -f assessments.html assessment-shell-v4.js
      - name: Canonical assessment parity and safety tests
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');const ctx={window:{}};vm.createContext(ctx);vm.runInContext(fs.readFileSync('assessment-registry-v3.js','utf8'),ctx);
          const R=ctx.window.SyntropixAssessmentRegistryV3;if(!R||!R.sourceHash)throw Error('registry missing');
          const expected={'Managerial Effectiveness Index':50,'Executive Leadership Index':200,'CogniMorph Index':20,'Coachability Quotient':20,'Metacognitive Executive Assessment':20,'Strategic Inversion Diagnostics':20,'Self-Limiting Belief Auditor':20,'Cognitive Learning Profiler':20,'Commercial Instinct Index':24,'Communication Signature':24};
          for(const [name,n] of Object.entries(expected)){const d=R.bank[name];if(!d)throw Error('missing '+name);if(!Array.isArray(d.questions)||d.questions.length!==n)throw Error(name+' item count');if(!d.archetypes||!d.dimensionData||!d.phases)throw Error(name+' report data incomplete');const ids=new Set(d.questions.map(q=>q.id));if(ids.size!==n)throw Error(name+' duplicate item ids');for(const q of d.questions)if(!q.dim||typeof q.rev!=='boolean'||!q.text)throw Error(name+' malformed item');}
          function score(d,raw){let total=0;for(const q of d.questions)total+=q.rev?7-raw(q):raw(q);return Math.round((((total/d.questions.length)-1)/5)*1000)/10}
          for(const d of Object.values(R.bank)){for(const v of [1,3,6]){const s=score(d,()=>v);if(!(s>=0&&s<=100))throw Error('score range')}const s=score(d,q=>(q.id%6)+1);if(!Number.isFinite(s))throw Error('mixed score')}
          console.log('Canonical registry integrity + deterministic scoring gate passed',R.sourceHash);
          NODE
          grep -q 'assessment-runtime-v3.html?assessment=' professionals.html
          if grep -q '/assessments.html?assessment=' professionals.html assessment-catalogue-v6.js; then echo 'Legacy assessment route remains'; exit 1; fi
          grep -q 'check-discount-status' assessment-runtime-v3.js
          grep -q 'payments/upi-submit' assessment-runtime-v3.js
          grep -q 'payments/verify' assessment-runtime-v3.js
          grep -q 'organizations/claim-license' assessment-runtime-v3.js
          grep -q 'reports/submit' assessment-runtime-v3.js
          grep -q 'validation/submit' assessment-runtime-v3.js
          grep -q 'syntropix_pending_completion' assessment-runtime-v3.js
          grep -q 'assessment-invite-router-v1.js' index.html
          grep -q 'assessment-assignment-ui-v1.js' professionals.html
          test ! -e assessments.html
          test ! -e assessment-shell-v4.js
      - name: Verify complete website artifact
        shell: bash
        run: |
          set -euo pipefail
          for f in index.html professionals.html enterprise.html assessment-runtime-v3.html assessment-runtime-v3.css assessment-runtime-v3.js assessment-registry-v3.js assessment-catalogue-v6.js assessment-invite-router-v1.js assessment-assignment-ui-v1.js assessment-suite-v2.js assessment-suite-v2-runner.html assessment-suite-v2-runner.js suite-checkout-v1.js consumer-insight-suite.js consumer-insight-runner.html consumer-insight-runner.js consumer-series-checkout-v1.js enterprise-system-suite.js enterprise-system-runner.html enterprise-system-runner.js enterprise-console.html enterprise-console.js site-v5.css mobile-responsive-v1.css premium-ui-v1.css global-footer-v1.js auth-passwordless.js science.html trust.html privacy.html terms.html CNAME; do test -s "$f" || { echo "Missing required file: $f"; exit 1; }; done
          grep -qi 'six capability layers' index.html
          grep -q 'Relationship & Intimacy Blueprint' consumer-insight-suite.js
          grep -q 'Human–AI Collaboration Readiness Index' enterprise-system-suite.js
          grep -q 'Customer-Centric Decision Intelligence Index' enterprise-system-suite.js
          grep -q 'Download completion CSV' enterprise-console.html
          grep -q 'bulk-assign' enterprise-console.js
          grep -q 'signInWithOtp' auth-passwordless.js
          grep -q 'shouldCreateUser:false' auth-passwordless.js
          grep -q 'syntropix.in' CNAME
          if grep -q 'website-v3-loader.js' index.html; then echo 'Obsolete homepage loader detected'; exit 1; fi
          echo 'Fresh Syntropix website + canonical assessment runtime verification passed'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - run: sleep 90
      - name: Deploy verified Syntropix artifact last
        id: deployment
        uses: actions/deploy-pages@v4
