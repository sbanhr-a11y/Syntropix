name: Deploy Syntropix website to GitHub Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "syntropix-custom-pages"
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - name: Verify repository is deployment-ready without mutation
        shell: bash
        run: |
          set -euo pipefail
          for f in index.html professionals.html enterprise.html pricing.html privacy.html terms.html refund-cancellation.html; do
            grep -q '/premium-ui-v1.css' "$f"
            grep -q '/mobile-responsive-v1.css' "$f"
            grep -q '/global-footer-v1.js' "$f"
            grep -q '/premium-ui-v1.js' "$f"
          done
          # Access-gate pages intentionally have no public footer or premium-ui JS;
          # still require the canonical premium colour and responsive presentation layers.
          for f in signin.html admin.html; do
            grep -q '/premium-ui-v1.css' "$f"
            grep -q '/mobile-responsive-v1.css' "$f"
          done
          grep -q '/assessment-suite-v2-catalogue.js' professionals.html
          grep -q '/consumer-insight-catalogue.js' professionals.html
          grep -q '/assessment-assignment-ui-v1.js' professionals.html
          test ! -e assessments.html
          test ! -e assessment-shell-v4.js
          echo 'Repository source equals deployable presentation contract'
      - name: Canonical assessment runtime safety gate
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm'),ctx={window:{}};vm.createContext(ctx);vm.runInContext(fs.readFileSync('assessment-registry-v3.js','utf8'),ctx);const R=ctx.window.SyntropixAssessmentRegistryV3;
          const expected={'Managerial Effectiveness Index':50,'Executive Leadership Index':200,'CogniMorph Index':20,'Coachability Quotient':20,'Metacognitive Executive Assessment':20,'Strategic Inversion Diagnostics':20,'Self-Limiting Belief Auditor':20,'Cognitive Learning Profiler':20,'Commercial Instinct Index':24,'Communication Signature':24};
          if(!R?.sourceHash)throw Error('registry fingerprint missing');for(const [n,c] of Object.entries(expected)){const d=R.bank[n];if(!d||d.questions.length!==c||!d.archetypes||!d.dimensionData||!d.phases)throw Error(n+' registry integrity');if(new Set(d.questions.map(q=>q.id)).size!==c)throw Error(n+' duplicate item ids')}
          console.log('Canonical registry verified',R.sourceHash)
          NODE
          node --check assessment-runtime-v3.js
          node --check assessment-validation-v2.js
          node --check region-sync-v1.js
          node --check assessment-test-lab-v1.js
          grep -q 'assessment-runtime-v3.html?assessment=' professionals.html
          ! grep -q '/assessments.html?assessment=' professionals.html
          ! grep -q '/assessments.html?assessment=' assessment-catalogue-v6.js
          grep -q 'payments/check-discount-status' assessment-runtime-v3.js
          grep -q 'payments/upi-submit' assessment-runtime-v3.js
          grep -q 'payments/verify' assessment-runtime-v3.js
          grep -q 'payments/access-status' assessment-runtime-v3.js
          grep -q 'payments/grant-bypass' assessment-runtime-v3.js
          grep -q 'reports/pdf' assessment-runtime-v3.js
          grep -q "resp.headers.get('X-Syntropix-Report-Emailed')" assessment-runtime-v3.js
          grep -q 'ai-coach/chat' assessment-runtime-v3.js
          grep -q 'Rate this experience to unlock PDF' assessment-runtime-v3.html
          grep -q 'How to read your report' assessment-runtime-v3.html
          grep -q 'assessment-brief' assessment-runtime-v3.html
          grep -q 'ABOUT THIS ASSESSMENT' assessment-runtime-v3.html
          grep -q 'const ASSESSMENT_GUIDES=' assessment-runtime-v3.js
          grep -q 'Read the topology longitudinally' assessment-runtime-v3.js
          grep -q 'YOUR FIRST 7 DAYS' assessment-runtime-v3.js
          grep -q 'function buildStructuredReportData' assessment-runtime-v3.js
          grep -q 'signal-green' assessment-runtime-v3.css
          grep -q 'signal-amber' assessment-runtime-v3.css
          grep -q 'signal-red' assessment-runtime-v3.css
          grep -q 'referral-dialog' assessment-runtime-v3.html
          grep -q '/reports/refer' assessment-runtime-v3.js
          ! grep -q 'WhatsApp' assessment-runtime-v3.html
          ! grep -q '/reports/refer-whatsapp' assessment-runtime-v3.js
          grep -q 'Downloading the report will also email a copy to your registered inbox.' assessment-runtime-v3.js
          grep -q 'organizations/claim-license' assessment-runtime-v3.js
          grep -q 'reports/submit' assessment-runtime-v3.js
          grep -q 'validation/submit' assessment-runtime-v3.js
          grep -q 'syntropix_pending_completion' assessment-runtime-v3.js
          grep -q 'Secure session window' assessment-runtime-v3.html
          grep -q 'CAPABILITY TOPOLOGY' assessment-runtime-v3.html
          grep -q 'SYNTROPIX AI COACH' assessment-runtime-v3.html
          grep -q 'function topology' assessment-runtime-v3.js
          ! grep -q '<script src="/assessment-runtime-v3.js"></script>' assessment-runtime-v3.html
          grep -q '/assessment-test-lab-v1.js' assessment-runtime-v3.html
          grep -q "s.src='/assessment-runtime-v3.js'" assessment-test-lab-v1.js
          grep -q '/payments/access-status' assessment-test-lab-v1.js
          grep -q '/payments/grant-bypass' assessment-test-lab-v1.js
          grep -q 'INTERNAL TEST MODE · NO PAYMENT' assessment-test-lab-v1.js
          grep -q "begin('TEST-LAB-EPHEMERAL')" assessment-runtime-v3.js
          grep -q "d.sessionToken||'TEST-LAB-EPHEMERAL'" assessment-test-lab-v1.js
          grep -q 'supabase-js@' assessment-runtime-v3.html
          grep -q 'dimensionCopy' assessment-runtime-v3.js
          grep -q 'signal-cards' assessment-runtime-v3.html
          grep -q 'roadmap-visual' assessment-runtime-v3.html
          grep -q 'reflection-prompts' assessment-runtime-v3.html
          grep -q 'report-nav' assessment-runtime-v3.css
          grep -q 'profileSpread' assessment-runtime-v3.js
          grep -q 'setupInteractiveCoach' assessment-runtime-v3.js
          grep -q 'const BOOKS=' assessment-runtime-v3.js
          grep -q 'interpretationHtml' assessment-runtime-v3.js
          grep -q 'rating-stars' assessment-runtime-v3.html
          grep -q 'Secure session window' assessment-runtime-v3.html
          grep -q 'Ask Syntropix AI Coach' assessment-runtime-v3.html
          grep -q 'coach-grid{grid-template-columns:repeat(3' assessment-runtime-v3.css
          grep -q 'assessment-invite-router-v1.js' index.html
          grep -q 'assessment-assignment-ui-v1.js' professionals.html
          grep -q 'syntropix:regionchange' assessment-catalogue-v6.js
          grep -q 'syntropix:regionchange' assessment-suite-v2-catalogue.js
          test ! -e assessments.html
          test ! -e assessment-shell-v4.js
          test "$(wc -c < index.html)" -lt 100000
      - name: Verify complete website artifact
        shell: bash
        run: |
          set -euo pipefail
          for f in index.html professionals.html enterprise.html assessment-runtime-v3.html assessment-runtime-v3.css assessment-runtime-v3.js assessment-registry-v3.js assessment-catalogue-v6.js assessment-invite-router-v1.js assessment-assignment-ui-v1.js assessment-suite-v2.js assessment-suite-v2-runner.html assessment-suite-v2-runner.js suite-checkout-v1.js consumer-insight-suite.js consumer-insight-runner.html consumer-insight-runner.js consumer-series-checkout-v1.js enterprise-system-suite.js enterprise-system-runner.html enterprise-system-runner.js enterprise-console.html enterprise-console.js site-v5.css mobile-responsive-v1.css premium-ui-v1.css global-footer-v1.js auth-passwordless.js science.html trust.html privacy.html terms.html CNAME; do test -s "$f" || { echo "Missing required file: $f"; exit 1; }; done
          grep -qi 'Understand. Develop. Strengthen.' index.html
          test -s solutions.html
          grep -qi 'Start with the human problem' solutions.html
          grep -q 'Relationship & Intimacy Blueprint' consumer-insight-suite.js
          grep -q 'Human–AI Collaboration Readiness Index' enterprise-system-suite.js
          grep -q 'Customer-Centric Decision Intelligence Index' enterprise-system-suite.js
          grep -q 'Download completion CSV' enterprise-console.html
          grep -q 'bulk-assign' enterprise-console.js
          grep -q 'signInWithOtp' auth-passwordless.js
          grep -q 'shouldCreateUser:false' auth-passwordless.js
          grep -q 'syntropix.in' CNAME
          grep -Eq 'SYNTROPIX<span( class="brand-registration")?>®</span>' index.html
          grep -q 'Syntropix®' index.html
          echo 'Legacy-free Syntropix artifact verification passed'
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy verified Syntropix artifact last
        id: deployment
        uses: actions/deploy-pages@v4
