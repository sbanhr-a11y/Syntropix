name: Deploy Syntropix website to GitHub Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "syntropix-custom-pages"
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Build canonical assessment runner and report surface
        shell: python
        run: |
          from pathlib import Path
          import re
          engine=Path('index.html'); homepage=Path('homepage-v4.html')
          if not engine.is_file() or engine.stat().st_size < 500000: raise SystemExit('Assessment engine missing or unexpectedly small')
          if not homepage.is_file() or homepage.stat().st_size < 5000: raise SystemExit('Unified homepage missing or unexpectedly small')
          app=engine.read_text(encoding='utf-8'); app,n=re.subn(r'<header\b[^>]*id="main-header"[^>]*>.*?</header>','',app,count=1,flags=re.S)
          if n != 1: raise SystemExit('Could not structurally remove legacy assessment header')
          boot='<script>document.documentElement.classList.add("sx-legacy-boot")</script>'; css='<link rel="stylesheet" href="/assessment-shell-v4.css">'; js='<script src="/assessment-shell-v4.js" defer></script>'
          if boot not in app: app=app.replace('<head>','<head>'+boot,1)
          if css not in app: app=app.replace('</head>',css+'\n</head>',1)
          if js not in app: app=app.replace('</body>',js+'\n</body>',1)
          Path('assessments.html').write_text(app,encoding='utf-8'); Path('index.html').write_text(homepage.read_text(encoding='utf-8'),encoding='utf-8')
          augment='<script src="/site-v5-augment.js" defer></script>'
          for name in ['science.html','trust.html','privacy.html','terms.html','prism360/survey.html']:
            p=Path(name)
            if p.is_file():
              text=p.read_text(encoding='utf-8')
              if augment not in text: text=text.replace('</body>',augment+'\n</body>',1)
              p.write_text(text,encoding='utf-8')
          premium_css='<link rel="stylesheet" href="/premium-ui-v1.css" data-syntropix-theme="premium-champagne">'; consumer_css='<link rel="stylesheet" href="/consumer-insight-cards.css">'; mobile_css='<link rel="stylesheet" href="/mobile-responsive-v1.css">'; premium_js='<script src="/premium-ui-v1.js" defer></script>'; footer_js='<script src="/global-footer-v1.js" defer></script>'; meta_js='<script src="/assessment-card-meta-v9.js" defer></script>'
          for p in Path('.').rglob('*.html'):
            text=p.read_text(encoding='utf-8')
            if '</head>' in text and premium_css not in text: text=text.replace('</head>',premium_css+'\n</head>',1)
            if '</head>' in text and consumer_css not in text: text=text.replace('</head>',consumer_css+'\n</head>',1)
            if '</head>' in text and mobile_css not in text: text=text.replace('</head>',mobile_css+'\n</head>',1)
            if '</body>' in text and premium_js not in text: text=text.replace('</body>',premium_js+'\n</body>',1)
            if '</body>' in text and footer_js not in text: text=text.replace('</body>',footer_js+'\n</body>',1)
            if '</body>' in text and meta_js not in text: text=text.replace('</body>',meta_js+'\n</body>',1)
            p.write_text(text,encoding='utf-8')
          p=Path('professionals.html'); text=p.read_text(encoding='utf-8')
          for src in ['/assessment-suite-v2-catalogue.js','/consumer-insight-catalogue.js']:
            tag=f'<script src="{src}" defer></script>'
            if tag not in text: text=text.replace('</body>',tag+'\n</body>',1)
          p.write_text(text,encoding='utf-8')
      - name: Verify canonical artifact and preserved business engine
        shell: bash
        run: |
          set -euo pipefail
          for f in index.html assessments.html site-v5.css mobile-responsive-v1.css site-v5.js site-v5-augment.js global-footer-v1.js assessment-card-meta-v9.js premium-ui-v1.css premium-ui-v1.js assessment-shell-v4.css assessment-shell-v4.js assessment-catalogue-v6.js assessment-engine-loader.js assessment-suite-v2.js assessment-validation-v2.js assessment-suite-v2-runner.html assessment-suite-v2-runner.js assessment-suite-v2-catalogue.js suite-checkout-v1.js consumer-series-checkout-v1.js consumer-insight-suite.js consumer-insight-runner.html consumer-insight-runner.js consumer-insight-catalogue.js consumer-insight-cards.css auth-passwordless.js signin.html manager-development.html prism360.html talent-solutions.html employee-experience.html compliance-learning.html enterprise.html professionals.html enterprise-console.html enterprise-console.css enterprise-console.js enterprise-system-suite.js enterprise-system-runner.html enterprise-system-runner.js science.html trust.html privacy.html terms.html CNAME; do test -s "$f" || { echo "Missing required file: $f"; exit 1; }; done
          grep -qi 'six capability layers' index.html; grep -q 'lead-form' enterprise.html; grep -q 'Download completion CSV' enterprise-console.html; grep -q 'bulk-assign' enterprise-console.js
          grep -q 'paypal.com/sdk/js' assessments.html; grep -q 'PapaParse' assessments.html; grep -q 'sx-legacy-boot' assessments.html
          if grep -q 'id="main-header"' assessments.html; then echo 'Legacy assessment header remains in deployed DOM'; exit 1; fi
          grep -q 'suite-checkout-v1.js' assessment-suite-v2-runner.html; grep -q 'consumer-series-checkout-v1.js' consumer-insight-runner.html
          grep -q 'Commercial Instinct Index' assessment-catalogue-v6.js; grep -q 'SyntropixAssessmentSuiteV2' assessment-suite-v2.js
          grep -q 'Relationship & Intimacy Blueprint' consumer-insight-suite.js; grep -q 'Shadow Pattern Map' consumer-insight-suite.js; grep -q 'Attention & Reward Rhythm Map' consumer-insight-suite.js; grep -q "clinical:false" consumer-insight-suite.js
          if grep -Eqi 'diagnoses ADHD|diagnoses autism|measures dopamine|neurological measurement' consumer-insight-suite.js; then echo 'Unsafe consumer assessment claim detected'; exit 1; fi
          grep -q 'consumer-insight-catalogue.js' professionals.html; grep -q 'consumer-insight-cards.css' professionals.html
          grep -q 'Download / save PDF' consumer-insight-runner.html; grep -q 'Syntropix Development Coach' consumer-insight-runner.html
          grep -q 'Human–AI Collaboration Readiness Index' enterprise-system-suite.js; grep -q 'Customer-Centric Decision Intelligence Index' enterprise-system-suite.js
          grep -q 'global-footer-v1.js' index.html; grep -q 'global-footer-v1.js' enterprise.html; grep -q 'All rights reserved' global-footer-v1.js
          grep -q 'assessment-card-meta-v9.js' index.html; grep -q 'assessment-card-meta-v9.js' enterprise.html; grep -q 'assessment-card-meta-v9.js' professionals.html
          grep -q 'mobile-responsive-v1.css' index.html; grep -q 'mobile-responsive-v1.css' enterprise.html; grep -q 'mobile-responsive-v1.css' professionals.html
          grep -q 'Evidence before adjectives' science.html; grep -q 'Selected bibliography' science.html; grep -q 'Trust is a system, not a badge' trust.html
          grep -q 'signInWithOtp' auth-passwordless.js; grep -q 'shouldCreateUser:false' auth-passwordless.js; grep -q 'syntropix.in' CNAME; test "$(wc -c < assessments.html)" -gt 500000
          if grep -q 'website-v3-loader.js' index.html; then echo 'Legacy v3 loader leaked into homepage'; exit 1; fi
          echo 'Syntropix canonical assessment/report/enterprise/auth/consumer/mobile artifact verification passed'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - run: sleep 90
      - name: Deploy verified Syntropix artifact last
        id: deployment
        uses: actions/deploy-pages@v4
