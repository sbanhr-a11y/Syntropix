name: Deploy Syntropix website to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build separated public and assessment experiences
        shell: python
        run: |
          from pathlib import Path
          import shutil
          legacy = Path('index.html')
          homepage = Path('homepage-v4.html')
          if not legacy.is_file() or legacy.stat().st_size < 500000:
              raise SystemExit('Legacy assessment application missing or unexpectedly small; refusing deployment')
          if not homepage.is_file() or homepage.stat().st_size < 5000:
              raise SystemExit('Website v4 homepage missing or unexpectedly small; refusing deployment')
          shutil.copy2(legacy, 'assessments.html')
          shutil.copy2(homepage, 'index.html')
          print('Public homepage replaced; legacy assessment application preserved at /assessments.html')

      - name: Verify production artifact boundaries
        shell: bash
        run: |
          set -euo pipefail
          for f in index.html assessments.html homepage-v4.css homepage-v4.js enterprise.html professionals.html science.html trust.html CNAME; do
            test -s "$f" || { echo "Missing required file: $f"; exit 1; }
          done
          grep -q 'Build better managers' index.html
          grep -q '/assessments.html' index.html
          grep -q 'homepage-v4.css' index.html
          grep -q 'homepage-v4.js' index.html
          grep -q 'paypal.com/sdk/js' assessments.html
          grep -q 'PapaParse' assessments.html
          grep -q 'syntropix.in' CNAME
          test "$(wc -c < assessments.html)" -gt 500000
          if grep -q 'website-v3-loader.js' index.html; then echo 'Legacy v3 loader leaked into new homepage'; exit 1; fi
          echo "Website v4 production boundary verification passed"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
