name: Deploy Syntropix website to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "syntropix-custom-pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build unified v5 experience without rewriting assessment engine
        shell: python
        run: |
          from pathlib import Path
          engine=Path('index.html'); homepage=Path('homepage-v4.html')
          if not engine.is_file() or engine.stat().st_size < 500000: raise SystemExit('Assessment engine missing or unexpectedly small')
          if not homepage.is_file() or homepage.stat().st_size < 5000: raise SystemExit('Unified homepage missing or unexpectedly small')
          app=engine.read_text(encoding='utf-8')
          css='<link rel="stylesheet" href="/assessment-shell-v4.css">'; js='<script src="/assessment-shell-v4.js" defer></script>'
          if css not in app: app=app.replace('</head>',css+'\n</head>',1)
          if js not in app: app=app.replace('</body>',js+'\n</body>',1)
          Path('assessments.html').write_text(app,encoding='utf-8')
          Path('index.html').write_text(homepage.read_text(encoding='utf-8'),encoding='utf-8')
      - name: Verify v5 artifact and preserved functional engine
        shell: bash
        run: |
          set -euo pipefail
          for f in index.html assessments.html site-v5.css site-v5.js assessment-shell-v4.css assessment-shell-v4.js assessment-intelligence.html manager-development.html prism360.html talent-solutions.html employee-experience.html compliance-learning.html enterprise.html professionals.html science.html trust.html privacy.html terms.html CNAME; do test -s "$f" || { echo "Missing required file: $f"; exit 1; }; done
          grep -q 'Six capability layers' index.html
          grep -q '/compliance-learning.html' index.html
          grep -q '/employee-experience.html' index.html
          grep -q 'What People Are Saying' index.html
          grep -q 'Training experience delivered' index.html
          grep -q 'Manager Development + Coaching' manager-development.html
          grep -q 'Syntropix Signal' employee-experience.html
          grep -q 'COMING SOON' compliance-learning.html
          grep -q 'lead-form' enterprise.html
          grep -q 'paypal.com/sdk/js' assessments.html
          grep -q 'PapaParse' assessments.html
          grep -q 'assessment-shell-v4.css' assessments.html
          grep -q 'assessment-shell-v4.js' assessments.html
          grep -q '#main-header{display:none' assessment-shell-v4.css
          grep -q 'syntropix.in' CNAME
          test "$(wc -c < assessments.html)" -gt 500000
          if grep -q 'website-v3-loader.js' index.html; then echo 'Legacy v3 loader leaked into v5 homepage'; exit 1; fi
          echo 'Syntropix v5 unified artifact verification passed'
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Wait for repository-source Pages build to finish
        run: sleep 90
      - name: Deploy verified unified Syntropix artifact last
        id: deployment
        uses: actions/deploy-pages@v4
