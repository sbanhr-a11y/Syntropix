name: Deploy Syntropix website to GitHub Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "syntropix-custom-pages"
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Build canonical website artifact
        shell: python
        run: |
          from pathlib import Path
          required=['index.html','assessment-registry-v3.js','assessment-runtime-v3.html','assessment-runtime-v3.js']
          for f in required:
            if not Path(f).is_file() or Path(f).stat().st_size<100: raise SystemExit('Missing canonical asset: '+f)
          premium_css='<link rel="stylesheet" href="/premium-ui-v1.css" data-syntropix-theme="premium-champagne">';consumer_css='<link rel="stylesheet" href="/consumer-insight-cards.css">';mobile_css='<link rel="stylesheet" href="/mobile-responsive-v1.css">';premium_js='<script src="/premium-ui-v1.js" defer></script>';footer_js='<script src="/global-footer-v1.js" defer></script>';meta_js='<script src="/assessment-card-meta-v9.js" defer></script>'
          for p in Path('.').rglob('*.html'):
            text=p.read_text(encoding='utf-8')
            for tag in [premium_css,consumer_css,mobile_css]:
              if '</head>' in text and tag not in text:text=text.replace('</head>',tag+'\n</head>',1)
            for tag in [premium_js,footer_js,meta_js]:
              if '</body>' in text and tag not in text:text=text.replace('</body>',tag+'\n</body>',1)
            p.write_text(text,encoding='utf-8')
          p=Path('professionals.html');text=p.read_text(encoding='utf-8')
          for src in ['/assessment-suite-v2-catalogue.js','/consumer-insight-catalogue.js','/assessment-assignment-ui-v1.js']:
            tag=f'<script src="{src}" defer></script>'
            if tag not in text:text=text.replace('</body>',tag+'\n</body>',1)
          p.write_text(text,encoding='utf-8')
          # Belt-and-suspenders: historical front files can never enter the Pages artifact.
          for f in ['assessments.html','assessment-shell-v4.js']:
            Path(f).unlink(missing_ok=True)
      - name: Canonical assessment runtime safety gate
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm'),ctx={window:{}};vm.createContext(ctx);vm.runInContext(fs.readFileSync('assessment-registry-v3.js','utf8'),ctx);const R=ctx.window.SyntropixAssessmentRegistryV3;
          const expected={'Managerial Effectiveness Index':50,'Executive Leadership Index':200,'CogniMorph Index':20,'Coachability Quotient':20,'Metacognitive Executive Assessment':20,'Strategic Inversion Diagnostics':20,'Self-Limiting Belief Auditor':20,'Cognitive Learning Profiler':20,'Commercial Instinct Index':24,'Communication Signature':24};
          if(!R?.sourceHash)throw Error('registry fingerprint missing');for(const [n,c] of Object.entries(expected)){const d=R.bank[n];if(!d||d.questions.length!==c||!d.archetypes||!d.dimensionData||!d.phases)throw Error(n+' registry integrity');if(new Set(d.questions.map(q=>q.id)).size!==c)throw Error(n+' duplicate item ids')}
          console.log('Canonical registry verified',R.sourceHash)
          NODE
          grep -q 'assessment-runtime-v3.html?assessment=' professionals.html
          ! grep -q '/assessments.html?assessment=' professionals.html
          ! grep -q '/assessments.html?assessment=' assessment-catalogue-v6.js
          grep -q 'payments/check-discount-status' assessment-runtime-v3.js
          grep -q 'payments/upi-submit' assessment-runtime-v3.js
          grep -q 'payments/verify' assessment-runtime-v3.js
          grep -q 'organizations/claim-license' assessment-runtime-v3.js
          grep -q 'reports/submit' assessment-runtime-v3.js
          grep -q 'validation/submit' assessment-runtime-v3.js
          grep -q 'syntropix_pending_completion' assessment-runtime-v3.js
          grep -q 'assessment-invite-router-v1.js' index.html
          grep -q 'assessment-assignment-ui-v1.js' professionals.html
          test ! -e assessments.html
          test ! -e assessment-shell-v4.js
          test "$(wc -c < index.html)" -lt 100000
      - name: Verify complete website artifact
        shell: bash
        run: |
          set -euo pipefail
          for f in index.html professionals.html enterprise.html assessment-runtime-v3.html assessment-runtime-v3.css assessment-runtime-v3.js assessment-registry-v3.js assessment-catalogue-v6.js assessment-invite-router-v1.js assessment-assignment-ui-v1.js assessment-suite-v2.js assessment-suite-v2-runner.html assessment-suite-v2-runner.js suite-checkout-v1.js consumer-insight-suite.js consumer-insight-runner.html consumer-insight-runner.js consumer-series-checkout-v1.js enterprise-system-suite.js enterprise-system-runner.html enterprise-system-runner.js enterprise-console.html enterprise-console.js site-v5.css mobile-responsive-v1.css premium-ui-v1.css global-footer-v1.js auth-passwordless.js science.html trust.html privacy.html terms.html CNAME; do test -s "$f" || { echo "Missing required file: $f"; exit 1; }; done
          grep -qi 'six capability layers' index.html
          grep -q 'Relationship & Intimacy Blueprint' consumer-insight-suite.js
          grep -q 'Human–AI Collaboration Readiness Index' enterprise-system-suite.js
          grep -q 'Customer-Centric Decision Intelligence Index' enterprise-system-suite.js
          grep -q 'Download completion CSV' enterprise-console.html
          grep -q 'bulk-assign' enterprise-console.js
          grep -q 'signInWithOtp' auth-passwordless.js
          grep -q 'shouldCreateUser:false' auth-passwordless.js
          grep -q 'syntropix.in' CNAME
          echo 'Legacy-free Syntropix artifact verification passed'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - run: sleep 90
      - name: Deploy verified Syntropix artifact last
        id: deployment
        uses: actions/deploy-pages@v4
