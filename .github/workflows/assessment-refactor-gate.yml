# Integrated release gate: legacy engine preservation + suite-v2 deterministic scoring
name: Assessment Refactor Safety Gate

on:
  pull_request:
    paths:
      - 'index.html'
      - 'assessment-engine-*.js'
      - 'assessment-suite-v2*.js'
      - 'assessment-suite-v2*.html'
      - 'assessment-validation-v2.js'
      - 'science.html'
      - 'trust.html'
      - 'tools/extract-assessment-bank.py'
      - '.github/workflows/assessment-refactor-gate.yml'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity-source-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract legacy assessment bank without executing it
        run: python tools/extract-assessment-bank.py --source index.html --output build/assessment-bank.snapshot.js
      - name: Verify extraction and refactor guards
        shell: bash
        run: |
          set -euo pipefail
          test -s build/assessment-bank.snapshot.js
          grep -q 'sha256:' build/assessment-bank.snapshot.js
          grep -q 'SyntropixAssessmentEngine' assessment-engine-loader.js
          grep -q 'SyntropixAssessmentParity' assessment-engine-parity.js
          bytes=$(wc -c < build/assessment-bank.snapshot.js)
          test "$bytes" -gt 10000 || { echo "assessmentBank extraction unexpectedly small: $bytes"; exit 1; }
      - name: Verify new suite governance and item integrity
        shell: bash
        run: |
          set -euo pipefail
          for f in assessment-suite-v2.js assessment-validation-v2.js assessment-suite-v2-runner.html assessment-suite-v2-runner.js assessment-suite-v2-catalogue.js; do test -s "$f"; done
          count=$(grep -o "make({title:" assessment-suite-v2.js | wc -l | tr -d ' ')
          test "$count" -eq 10 || { echo "Expected 10 suite-v2 instruments, found $count"; exit 1; }
          grep -q "status:'research-informed'" assessment-suite-v2.js
          grep -q "selection:false" assessment-suite-v2.js
          grep -q "clinical:false" assessment-suite-v2.js
          grep -q 'Developmental indicator' assessment-validation-v2.js
          grep -q 'Selected bibliography' science.html
          grep -q '← Back' science.html
          grep -q '← Back' trust.html
          grep -q 'window.print()' assessment-suite-v2-runner.html
          grep -q 'localStorage.setItem' assessment-suite-v2-runner.js
          echo "Assessment suite v2 governance gate passed."
      - name: Deterministic scoring smoke test
        run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const ctx={window:{}};vm.createContext(ctx);
          for(const f of ['assessment-engine-loader.js','assessment-suite-v2.js','assessment-validation-v2.js']) vm.runInContext(fs.readFileSync(f,'utf8'),ctx,{filename:f});
          const defs=ctx.window.SyntropixAssessmentSuiteV2,V=ctx.window.SyntropixAssessmentValidation;
          if(Object.keys(defs).length!==10) throw new Error('suite count');
          for(const [name,d] of Object.entries(defs)){
            const q=V.quality(d);if(!q.ok) throw new Error(name+': '+q.errors.join('; '));
            for(const raw of [1,3,5]){const r={};d.questions.forEach(x=>r[x.id]=raw);const s=V.score(d,r);if(!Number.isFinite(s.overall)) throw new Error(name+' score');if(s.validationStatus!=='research-informed') throw new Error(name+' evidence state');}
            const mixed={};d.questions.forEach((x,i)=>mixed[x.id]=(i%5)+1);const s=V.score(d,mixed);if(Object.keys(s.dimensions).length<3) throw new Error(name+' dimensions');
          }
          console.log('Deterministic suite-v2 scoring smoke test passed');
          NODE
