name: Visual PR screenshot evidence (read only)
on:
  pull_request:
    paths:
      - '.github/workflows/visual-pr-evidence.yml'
      - 'tests/visual-compare.py'
      - 'tests/visual-evidence-capture.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        ref: [main, audit/visual-regression-responsive-20261012]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - name: Get comparison script from proposed patch
        if: matrix.ref == 'main'
        run: |
          curl -fsSL https://raw.githubusercontent.com/sbanhr-a11y/Syntropix/audit/visual-regression-responsive-20261012/tests/visual-evidence-capture.js -o /tmp/visual-evidence-capture.js
      - name: Select comparison script
        run: |
          if [ "${{ matrix.ref }}" = "main" ]; then mkdir -p tests && cp /tmp/visual-evidence-capture.js tests/visual-evidence-capture.js; fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --no-package-lock --ignore-scripts @playwright/test@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve exact checked-out revision
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/visual-local.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8765/ >/dev/null && break; sleep 1; done
      - name: Capture comparable screenshots
        run: node tests/visual-evidence-capture.js
      - name: Publish evidence without changing production
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshot-${{ strategy.job-index }}
          path: test-results/comparison
          retention-days: 14

  compare:
    needs: capture
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/visual-regression-responsive-20261012
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: screenshot-*
          path: evidence
      - name: Install image difference dependency
        run: python3 -m pip install pillow==11.3.0
      - name: Compute pixel-by-pixel changes and guard unrelated pages
        run: python3 tests/visual-compare.py
      - name: Publish comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pixel-difference-report
          path: visual-diff/
          if-no-files-found: warn
          retention-days: 14
