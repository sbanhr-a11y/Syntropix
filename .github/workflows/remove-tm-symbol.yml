name: Remove obsolete trademark symbols
on:
  push:
    branches: ["main"]
permissions:
  contents: write
jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, '[tm-cleanup]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove obsolete mark from product source, docs and filenames
        shell: python
        run: |
          from pathlib import Path
          import subprocess, zipfile, tempfile, os
          TM=chr(0x2122);entities=['&'+'trade;','&#'+'8482;','&#x'+'2122;','&#X'+'2122;','\\u'+'2122']
          text_ext={'.html','.js','.css','.md','.txt','.json','.csv','.xml','.svg','.sql','.py','.toml','.ini'}
          tracked=[x for x in subprocess.check_output(['git','ls-files','-z']).decode('utf-8').split('\0') if x and not x.startswith('.github/workflows/')]
          def clean(t):
            t=t.replace(TM,'')
            for x in entities:t=t.replace(x,'')
            return t
          for name in tracked:
            p=Path(name)
            if p.suffix.lower() in text_ext:
              try:old=p.read_text(encoding='utf-8')
              except UnicodeDecodeError:continue
              new=clean(old)
              if new!=old:p.write_text(new,encoding='utf-8')
            elif p.suffix.lower()=='.docx':
              changed=False;fd,tmp=tempfile.mkstemp(suffix='.docx');os.close(fd)
              try:
                with zipfile.ZipFile(p,'r') as zin,zipfile.ZipFile(tmp,'w') as zout:
                  for info in zin.infolist():
                    data=zin.read(info.filename)
                    if info.filename.endswith(('.xml','.rels')):
                      try:
                        old=data.decode('utf-8');new=clean(old)
                        if new!=old:changed=True;data=new.encode('utf-8')
                      except UnicodeDecodeError:pass
                    zout.writestr(info,data)
                if changed:os.replace(tmp,p)
                else:os.unlink(tmp)
              except Exception:
                if os.path.exists(tmp):os.unlink(tmp)
                raise
          for name in sorted(tracked,key=len,reverse=True):
            if TM in name:subprocess.check_call(['git','mv',name,name.replace(TM,'')])
      - name: Verify product source and documentation
        shell: python
        run: |
          from pathlib import Path
          import subprocess,zipfile
          TM=chr(0x2122);bad=[];exts={'.html','.js','.css','.md','.txt','.json','.csv','.xml','.svg','.sql','.py','.toml','.ini'}
          for n in subprocess.check_output(['git','ls-files']).decode().splitlines():
            if n.startswith('.github/workflows/'):continue
            if TM in n:bad.append(n+' [filename]');continue
            p=Path(n)
            if p.suffix.lower() in exts:
              try:
                if TM in p.read_text(encoding='utf-8'):bad.append(n)
              except UnicodeDecodeError:pass
            elif p.suffix.lower()=='.docx':
              with zipfile.ZipFile(p) as z:
                if any(TM.encode('utf-8') in z.read(x) for x in z.namelist() if x.endswith(('.xml','.rels'))):bad.append(n)
          if bad:raise SystemExit('Obsolete mark remains in: '+', '.join(bad))
      - name: Commit cleaned product source
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then echo 'No obsolete marks found'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- ':!.github/workflows'
          git commit -m 'Remove obsolete trademark symbols repository-wide [tm-cleanup]'
          git push
