name: Remove obsolete trademark symbols
on:
  push:
    branches: ["main"]
permissions:
  contents: write
jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, '[tm-cleanup]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove trademark symbol from text and filenames
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          text_ext={'.html','.js','.css','.md','.txt','.json','.yml','.yaml','.csv','.xml','.svg','.sql','.py','.toml','.ini'}
          tracked=subprocess.check_output(['git','ls-files','-z']).decode('utf-8').split('\0')
          tracked=[x for x in tracked if x]
          for name in tracked:
            p=Path(name)
            if p.suffix.lower() in text_ext:
              try: text=p.read_text(encoding='utf-8')
              except UnicodeDecodeError: continue
              if '™' in text: p.write_text(text.replace('™',''),encoding='utf-8')
          # Remove the symbol from tracked filenames too, preserving binary assets unchanged.
          for name in sorted(tracked,key=len,reverse=True):
            if '™' not in name: continue
            new=name.replace('™','')
            subprocess.check_call(['git','mv',name,new])
      - name: Verify complete removal
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -F '™'; then echo 'Trademark symbol remains in filename'; exit 1; fi
          python - <<'PY'
          from pathlib import Path
          import subprocess
          exts={'.html','.js','.css','.md','.txt','.json','.yml','.yaml','.csv','.xml','.svg','.sql','.py','.toml','.ini'}
          bad=[]
          for n in subprocess.check_output(['git','ls-files']).decode().splitlines():
            p=Path(n)
            if p.suffix.lower() in exts:
              try: t=p.read_text(encoding='utf-8')
              except UnicodeDecodeError: continue
              if '™' in t: bad.append(n)
          if bad: raise SystemExit('Trademark symbol remains in: '+', '.join(bad))
          PY
      - name: Commit cleaned source
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then echo 'No trademark symbols found'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove trademark symbols repository-wide [tm-cleanup]'
          git push
