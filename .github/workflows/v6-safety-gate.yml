name: V6 Quiet Intelligence Safety Gate
on:
  push:
    branches: [v6-quiet-intelligence]
  pull_request:
    branches: [main]
jobs:
  protect-workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Freeze protected functional surfaces against V5 baseline
        run: |
          BASE=dac963dcc7f4acf7248efbde9601dea16d462099
          git diff --exit-code "$BASE" -- assessment-registry-v3.js assessment-runtime-v3.html assessment-runtime-v3.js assessment-validation-v2.js assessment-test-lab-v1.js auth-passwordless.js assessment-assignment-ui-v1.js assessment-invite-router-v1.js region-sync-v1.js suite-checkout-v1.js consumer-series-checkout-v1.js enterprise-console.html enterprise-console.js enterprise-console.css admin.html prism360/survey.html enterprise-system-runner.html enterprise-system-runner.js consumer-insight-runner.html consumer-insight-runner.js
      - name: Verify V6 architecture
        run: |
          test -f V6_DESIGN_MIGRATION_BLUEPRINT.md
          test -f v6-quiet-intelligence.css
          test -f solutions.html
          grep -q 'v6-quiet-intelligence.css' index.html
          grep -q 'Human capability is not one score' index.html
          grep -q 'What are you trying to' solutions.html
      - name: Protect canonical assessment runtime
        run: |
          grep -q 'assessment-registry-v3.js' assessment-runtime-v3.html
          test -f assessment-runtime-v3.js
          grep -q 'payments/check-discount-status' assessment-runtime-v3.js
          grep -q 'payments/verify' assessment-runtime-v3.js
          grep -q 'organizations/claim-license' assessment-runtime-v3.js
          grep -q 'reports/submit' assessment-runtime-v3.js
          grep -q 'validation/submit' assessment-runtime-v3.js
      - name: Protect discovery and auth hooks
        run: |
          grep -q 'assessment-invite-router-v1.js' index.html
          grep -q 'assessment-assignment-ui-v1.js' professionals.html
          grep -q 'assessment-runtime-v3.html' professionals.html
          grep -q 'auth-passwordless.js' signin.html
      - name: Mirror production Pages presentation contract
        run: |
          for f in index.html professionals.html enterprise.html pricing.html privacy.html terms.html refund-cancellation.html; do
            grep -q '/premium-ui-v1.css' "$f"
            grep -q '/mobile-responsive-v1.css' "$f"
            grep -q '/global-footer-v1.js' "$f"
            grep -q '/premium-ui-v1.js' "$f"
          done
          grep -q '/assessment-suite-v2-catalogue.js' professionals.html
          grep -q '/consumer-insight-catalogue.js' professionals.html
          grep -q '/assessment-assignment-ui-v1.js' professionals.html
          test ! -e assessments.html
          test ! -e assessment-shell-v4.js
      - name: Protect commercial and legal routes
        run: |
          test -f pricing.html
          test -f privacy.html
          test -f terms.html
          test -f refund-cancellation.html
          test -f enterprise.html
          test -f science.html
          test -f trust.html
      - name: Audit internal routes and assets
        run: python3 scripts/v6_static_audit.py
      - name: Prevent V6 from silently weakening product status
        run: |
          grep -qi 'coming soon' compliance-learning.html
