name: V6 Architecture Browser Parity QA

on:
  push:
    branches:
      - main
      - v6-architecture-consolidation-v3
  pull_request:
    branches:
      - main
    paths:
      - 'index.html'
      - 'enterprise.html'
      - 'professionals.html'
      - 'solutions.html'
      - 'employee-experience.html'
      - 'trust.html'
      - 'company.html'
      - 'evidence-in-practice.html'
      - 'technical-notes.html'
      - 'trust-center.html'
      - 'manager-development.html'
      - 'prism360.html'
      - 'v6-credibility.css'
      - 'v6-foundation.css'
      - 'v6-home.css'
      - 'v6-shared.css'
      - 'site-v5.js'
      - 'qa/v6-architecture-browser-qa.mjs'
      - '.github/workflows/v6-architecture-browser-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v6-architecture-browser-qa
  cancel-in-progress: true

jobs:
  browser-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install browser QA dependencies
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start exact-branch static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/syntropix-http.log 2>&1 &
          echo $! > /tmp/syntropix-http.pid
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/syntropix-http.log
          exit 1

      - name: Run browser parity suite
        run: node qa/v6-architecture-browser-qa.mjs

      - name: Upload browser QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v6-architecture-browser-qa
          path: |
            qa-output/
          retention-days: 14
