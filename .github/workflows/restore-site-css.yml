name: Restore complete shared site CSS
on:
  push:
    branches: ["main"]
permissions:
  contents: write
jobs:
  restore:
    if: ${{ !contains(github.event.head_commit.message, '[css-restored]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Restore full stylesheet and retain current UI overrides
        shell: bash
        run: |
          set -euo pipefail
          git cat-file blob f9760a8ea34b429ee97a846a00859337f4e22c5a > site-v5.css
          cat >> site-v5.css <<'CSS'
          /* Syntropix registered-brand, footer and floating-control overrides */
          .brand{position:relative;display:inline-block;font-weight:900;letter-spacing:.13em;white-space:nowrap}.brand>span,.brand-registration{display:inline-block!important;color:#D6B878!important;font-size:.48em!important;line-height:1!important;letter-spacing:0!important;vertical-align:top!important;position:relative!important;top:.02em!important;margin-left:.18em!important;font-weight:900!important}.brand-tagline{display:block;color:#a8ada7;font-size:.38em;line-height:1.35;letter-spacing:.26em;margin-top:.42em;font-weight:800}footer a,footer a:link,footer a:visited,footer a:hover,footer a:focus,footer a:active{text-decoration:none!important;border-bottom:0!important;box-shadow:none!important}footer .footer-brand-lockup{display:flex;align-items:flex-start}footer .brand{color:#f6f7f4;font-size:clamp(22px,2vw,30px);line-height:1;text-decoration:none!important;border-bottom:0!important}footer .brand-tagline{font-size:10px;text-decoration:none!important}.floating{z-index:999!important;width:60px!important;height:60px!important;transition:transform .18s ease,box-shadow .18s ease,filter .18s ease!important}.floating:hover,.floating:focus-visible{transform:translateY(-3px) scale(1.04);filter:brightness(1.06)}.floating svg{width:25px!important;height:25px!important;stroke:currentColor;stroke-width:2.2}.call5{background:#D6B878!important;border:2px solid #E7D09A!important;color:#090b09!important;box-shadow:0 10px 30px rgba(214,184,120,.34),0 0 0 5px rgba(214,184,120,.10)!important}.chat5{background:#f4f6f0!important;border:2px solid #D6B878!important;color:#090b09!important;box-shadow:0 10px 30px rgba(0,0,0,.42),0 0 0 5px rgba(214,184,120,.13)!important}@media(max-width:680px){.brand>span,.brand-registration{font-size:.55em!important}.floating{width:56px!important;height:56px!important;bottom:18px!important}.call5{left:18px!important}.chat5{right:18px!important}}
          CSS
          test $(wc -c < site-v5.css) -gt 15000
      - name: Commit restored stylesheet
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site-v5.css
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Restore complete site stylesheet with UI overrides [css-restored]'
          git push
